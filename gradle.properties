org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── Réseau : retry automatique sur erreur transitoire (502, timeout…) ─────────
# Nombre de tentatives en cas d'échec de téléchargement d'une dépendance
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
# Réessaie jusqu'à 3 fois les résolutions de dépendances en erreur
systemProp.org.gradle.internal.repository.max.retries=3
systemProp.org.gradle.internal.repository.initial.backoff=500
