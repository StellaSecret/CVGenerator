[package]
name = "cv-generator"
version = "0.1.0"
edition = "2021"

[lib]
name = "cv_generator"
path = "src/lib.rs"

[[bin]]
name = "cv-generator"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
dioxus = { version = "0.7", features = ["web", "router", "asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
# Sentence-embedding backend for JD↔CV semantic matching (opt-in Embedding /
# Hybrid score modes). `default-features = false` avoids pulling in
# cuda/mkl/accelerate/rayon backends that don't build for wasm32 — inference
# runs on plain CPU float32 ops via the "cpu" backend, which is what
# candle's own wasm examples (candle-wasm-examples/bert) use.
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlScriptElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Node",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "EventTarget",
    "FileList",
    "FileReader",
    "Navigator",
    "Storage",
    "MediaQueryList",
    "console",
    "Cache",
    "CacheStorage",
    "Response",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-storage = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Enables real-browser `#[wasm_bindgen_test]` tests for the localStorage/
# CacheStorage/DOM-touching code in auth.rs, worker.rs, drive.rs, and
# skill_duration.rs that `#[cfg(not(target_arch = "wasm32"))]`-gates away
# from a native `cargo test --lib` entirely — run via
# `wasm-pack test --headless --chrome` (see the `wasm-*` shards in
# `.github/workflows/mutants.yml`).
wasm-bindgen-test = "0.3"
# Lets `#[cfg_attr(test, mutants::skip)]` compile: with the cfg_attr form
# (as opposed to a bare `#[mutants::skip]`), the `mutants` crate only needs
# to be a dev-dependency, not a full one — see https://mutants.rs/attrs.html.
# Needed here specifically because `cfg(test)` only becomes true (and so
# `mutants::skip` only needs to resolve at all) for the wasm32 *test*
# build, not the normal wasm32 app build — hence scoping it to this
# wasm32-only dev-dependencies table rather than the top-level one.
mutants = "0.0.3"

