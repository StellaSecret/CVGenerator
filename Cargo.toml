[package]
name = "cv-generator"
version = "0.1.0"
edition = "2021"

[lib]
name = "cv_generator"
path = "src/lib.rs"

[[bin]]
name = "cv-generator"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
dioxus = { version = "0.7", features = ["web", "router", "asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
# Sentence-embedding backend for JD↔CV semantic matching (opt-in Embedding /
# Hybrid score modes). `default-features = false` avoids pulling in
# cuda/mkl/accelerate/rayon backends that don't build for wasm32 — inference
# runs on plain CPU float32 ops via the "cpu" backend, which is what
# candle's own wasm examples (candle-wasm-examples/bert) use.
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlScriptElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Node",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "EventTarget",
    "FileList",
    "FileReader",
    "Navigator",
    "Storage",
    "MediaQueryList",
    "console",
    "Cache",
    "CacheStorage",
    "Response",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-storage = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
reqwest = { version = "0.12", features = ["json"] }
