[package]
name = "cv-generator"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "cv_generator"
path = "src/lib.rs"

[[bin]]
name = "cv-generator"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
dioxus = { version = "0.7", features = ["web", "router", "asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
# ^ "js" wires up getrandom 0.3.x's wasm_js backend feature for wasm32
# builds (see the longer note on the lopdf dependency below for why a
# second, separate getrandom major version needs its own feature flip too).
lopdf = { version = "0.42", default-features = false, features = ["wasm_js"] }
# ^ RUSTSEC-2026-0187: lopdf <0.42.0 parses nested PDF arrays/dicts with
# unbounded recursion, so a ~21 KB crafted PDF (deeply nested array in the
# Catalog) aborts the process via stack-overflow SIGABRT -- not catchable
# with catch_unwind, and directly reachable here since pdf_import feeds
# arbitrary user-uploaded PDFs straight into `Document::load_mem`. Fixed in
# 0.42.0 (bounded recursion depth).
#
# `nom_parser` (this crate's previous only-choice-anyway parser feature) no
# longer exists as of ~0.35 -- lopdf's changelog notes it dropped the
# `nom_locate`-based parser and parsing is unconditional now, so there's
# nothing to opt into there anymore.
#
# `wasm_js` IS needed though, and for a different reason than parsing: 0.42
# added mandatory (non-optional) encrypted-PDF support (`aes`/`cbc`/`ecb`)
# which pulls in `rand 0.10` -> `getrandom 0.4` as a brand-new *major*
# version, separate from the `getrandom 0.3.x` copy `uuid`'s own `js`
# feature (see below) already wires up. Each major version of `getrandom`
# needs its *own* `wasm_js` Cargo feature enabled before the shared
# `--cfg getrandom_backend="wasm_js"` in .cargo/config.toml can select a
# backend for it -- otherwise `cargo check --target wasm32-unknown-unknown`
# fails with "wasm32/64-unknown-unknown are not supported by default" from
# inside the *new* getrandom 0.4.x copy specifically. lopdf's own `wasm_js`
# feature forwards straight to `getrandom/wasm_js`, which is the minimal
# fix (no need to add getrandom as a direct dependency just to flip its
# feature).
#
# `default-features = false` still does real work: current lopdf's default
# features are `chrono`, `jiff`, `rayon`, `time` (date-type conversions +
# parallelism), none of which this project needs -- pdf_import/dates.rs
# does its own date parsing, and `rayon` doesn't help (or build cleanly)
# under wasm32-unknown-unknown anyway. Run `cargo update -p lopdf` to
# regenerate Cargo.lock (the 0.34->0.42 dependency set changed) and
# `cargo test --lib` (exercises pdf_import's test suite, including the
# mutation-kill tests in services/pdf_import/tests.rs) before merging.
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
# ^ Bumped from 0.21 to match what candle-core 0.11 already forces
# transitively; before this, Cargo.lock carried two full copies of
# tokenizers (0.21.4 direct + 0.22.2 via candle-core) since our pin was
# stale. Both versions want the same fancy-regex/derive_builder/
# spm_precompiled requirements and `unstable_wasm` is unchanged between
# them, so this collapses to a single resolved copy. Run `cargo test --lib`
# after `cargo update -p tokenizers` to confirm nothing in matcher/ or
# embeddings.rs hit an API change.
# Sentence-embedding backend for JD↔CV semantic matching (opt-in Embedding /
# Hybrid score modes). `default-features = false` avoids pulling in
# cuda/mkl/accelerate/rayon backends that don't build for wasm32 — inference
# runs on plain CPU float32 ops via the "cpu" backend, which is what
# candle's own wasm examples (candle-wasm-examples/bert) use.
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlScriptElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Node",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "EventTarget",
    "FileList",
    "FileReader",
    "Navigator",
    "Storage",
    "MediaQueryList",
    "console",
    "Cache",
    "CacheStorage",
    "Response",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-storage = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Enables real-browser `#[wasm_bindgen_test]` tests for the localStorage/
# CacheStorage/DOM-touching code in auth.rs, worker.rs, drive.rs, and
# skill_duration.rs that `#[cfg(not(target_arch = "wasm32"))]`-gates away
# from a native `cargo test --lib` entirely — run via
# `wasm-pack test --headless --chrome` (see the `wasm` shard in
# `.github/workflows/mutants.yml`).
wasm-bindgen-test = "0.3"
# Lets `#[cfg_attr(test, mutants::skip)]` compile: with the cfg_attr form
# (as opposed to a bare `#[mutants::skip]`), the `mutants` crate only needs
# to be a dev-dependency, not a full one — see https://mutants.rs/attrs.html.
# (`cfg(test)` is never true for a normal app build, so a dev-dependency
# suffices.) Sits at the top level rather than wasm32-scoped because
# i18n_core.rs's en()/fr() data tables are skip-attributed too and must
# compile under the native `cargo test --lib` the native shards run, not
# just the wasm32 test build.
[dev-dependencies]
mutants = "0.0.3"

