[package]
name = "cv-generator"
version = "0.1.0"
edition = "2021"

[lib]
name = "cv_generator"
path = "src/lib.rs"

[[bin]]
name = "cv-generator"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
dioxus = { version = "0.7", features = ["web", "router", "asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlScriptElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Node",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "EventTarget",
    "FileList",
    "FileReader",
    "Navigator",
    "Storage",
    "MediaQueryList",
    "console",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-storage = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
reqwest = { version = "0.12", features = ["json"] }
