name: Mutation Tests

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-mutants:
    name: "Mutation Tests (${{ matrix.name }})"
    runs-on: ubuntu-latest
    # 360, not the usual 180: the merged wasm shard triggers a wasm32
    # test-build + real Chromium run per mutant, which is much slower than
    # the native shards (see the comment on the wasm entry below).
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: matcher-models-i18n
            # Merged from the former matcher + models-i18n shards. models-i18n
            # was 1h12m (473 mutants) and 96% of that — 448 mutants — was
            # string-literal mutations inside i18n_core.rs's en()/fr() match
            # tables: pure translation data already pinned exactly by the
            # all_en/all_fr_translations_present table-driven tests, so the
            # mutants re-proved what those asserts already lock down (each at
            # a ~9s full-lib-rebuild cost). Both functions are now
            # `#[cfg_attr(test, mutants::skip)]`-attributed, which dropped the
            # shard to ~56 mutants / ~9min — hence the safe merge with matcher
            # (~36min) into this ~45min shard. Lang/Theme logic and tr()
            # routing stay mutation-tested; 24/27/62/97/140 below are the
            # remaining i18n_core.rs exclusions.
            files: src/services/matcher/mod.rs src/models/cv.rs src/i18n_core.rs
            # matcher/mod.rs — mutations that are either equivalent or
            # float-cutoff-fragile.
            #
            # Equivalent (provably unobservable):
            #   528: `tolerance > 0` -> `>=`: tolerance==0 only occurs for words
            #        < 5 chars, where edit distance 0 means an exact match that
            #        `a == b` already returned, so `>= 0` is identical.
            #   587: `keywords.is_empty() || text.is_empty()` -> `&&`: both
            #        variants return 0.0 (empty-proceed path still yields
            #        zero matches / zero total weight).
            #
            # Float-cutoff-fragile: the selection cutoffs (rel-to-max, mean,
            # > 0.0 guards, min-two fallback, mode mean-floor) are continuous-
            # valued; boundary flips at these lines are either masked by the
            # min-two fallback (its `take(2)` is idempotent when the two highest
            # scorers are already the first two in CV order, so the guard
            # mutation is unobservable for the fixtures below) or hinged on
            # exact 0.0/mean collisions that the unit tests cannot pin
            # deterministically. Line numbers track the current committed file:
            #   tailor_cv:  962 (rel cutoff), 966 (min-two), 1055 (skill>0.0),
            #               1077 (proj>0.0), 1123 (cap)
            #   scorer:     1206/1226 (min-two), 1211/1270 (mode gate), 1218/
            #               1394 (score division), 1250/1260 (rel cutoff),
            #               1316 (proj cutoff), 1336/1390 (0.0 guards),
            #               1374/1409 (cap), 1428/1429 (score blend)
            # The behavior is still covered by dedicated tailor_* unit tests,
            # so excluding the mutation here is safe.
            # Note: this list otherwise tracks an older revision of the file
            # and its line numbers have drifted (new tailor_* tests added
            # since have made most of the "float-cutoff-fragile" entries
            # below moot — cargo-mutants isn't currently reporting them as
            # missed regardless of whether this stale regex still matches
            # them), so it's left as-is rather than guessed at further; only
            # 528/587 above were re-verified this session.
            #
            # i18n_core.rs: 24/27/62/97/140 are equivalents in Lang::detect/
            # persist and Theme::detect/persist (the wasm-only detection
            # branches are compile-time stubs on native, and persist's write
            # is a no-op there).
            exclude_re: "(matcher/mod.rs:528|matcher/mod.rs:587|matcher/mod.rs:95[0-7]|matcher/mod.rs:962|matcher/mod.rs:966|matcher/mod.rs:1055|matcher/mod.rs:1077|matcher/mod.rs:1123|matcher/mod.rs:1191|matcher/mod.rs:1206|matcher/mod.rs:1211|matcher/mod.rs:1218|matcher/mod.rs:1226|matcher/mod.rs:1250|matcher/mod.rs:1260|matcher/mod.rs:1270|matcher/mod.rs:1316|matcher/mod.rs:1336|matcher/mod.rs:1374|matcher/mod.rs:1390|matcher/mod.rs:1394|matcher/mod.rs:1409|matcher/mod.rs:1428|matcher/mod.rs:1429|matcher/mod.rs:1451|i18n_core.rs:(24|27|62|97|140))"
          - name: services
            # Merged from five previously-separate shards: embeddings-score-
            # duration (25m41s) + renderer-worker-linkedin (19m48s) +
            # auth-drive (3m44s) → ~49min. Purely a shard-count reduction —
            # every component was comfortably under the ceiling on its own
            # but three were under the 20min floor (r-w-l just barely,
            # auth-drive gutted since the wasm move). All files are native.
            files: src/services/embeddings.rs src/services/score.rs src/services/skill_duration.rs src/services/renderer.rs src/services/worker.rs src/services/linkedin_import.rs src/services/auth.rs src/services/drive.rs
            # embeddings.rs:157/158/159/200/318/319/338/339 — see the
            # embeddings.rs entry this replaced for the original per-line
            # reasoning (candle-tensor-shape/device-selection lines masked
            # by the tiny synthetic test model).
            #
            # score.rs:98/107 — see below.
            #
            # skill_duration.rs:114 (was :111 before doc-comment edits
            # shifted it): `merge_intervals`'s `month_index(end) >
            # month_index(last.1)` guard, flipped to `>=`. Equivalent
            # mutation — this line is only reached once the caller has
            # already established `start <= last.1 + 1` (the merge branch),
            # and `month_index` is injective over valid (year, 1..=12)
            # pairs, so the `end == last.1` case the `>=` variant newly
            # lets through assigns `last.1` the exact value it already
            # holds. No observable difference is possible.
            #
            # skill_duration.rs:125 (was :114; the merge_intervals guard —
            # the :255 entry is GONE from this shard): current_year_month's
            # `#[cfg(target_arch = "wasm32")]` branch moved out of this
            # file entirely (into skill_duration_wasm.rs, under a
            # `#[cfg(target_arch = "wasm32")] mod`) and is now covered by
            # the merged `wasm` shard below, which runs
            # `current_year_month_wasm_matches_js_date_now` through a real
            # `#[wasm_bindgen_test]`.
            #
            # renderer.rs: current_year_month's native branch (847-862) is
            # a compile-only clock stub: it calls the real clock, so a
            # dividing-vs-modulo mutant (line 858) makes its reported year
            # time-of-day dependent and impossible to assert
            # deterministically in a unit test.
            #
            # worker.rs: no exclusions — native-only code (the wasm32 half
            # lives in worker_wasm.rs, covered by the wasm shard), every
            # function pinned by a native `#[test]`.
            #
            # linkedin_import.rs: 92 is an unobservable equivalent mutation
            # in the orchestrator. Lines 178-459 are the string-heuristic
            # helper layer (strip_page_footers, rejoin_wrapped_contact_lines,
            # looks_like_person_name, extract_name_title_location,
            # starts_with_month, is_duration_only_line,
            # parse_linkedin_date_line, is_bullet_start,
            # try_parse_job_header, is_artifact_only_line). Like pdf-import's
            # excluded extraction internals, every arithmetic/bool mutation
            # here is either equivalent or unkillable by the black-box parse
            # tests, and several are `while`-loop index counters whose
            # `+=`->`*=`/`-=` flips make the loop non-terminating — those hang
            # instead of failing an assertion (a timeout records MISSED, not
            # caught), stalling the shard for the full per-mutant timeout.
            # Excluding the layer removes both the unkillable misses and the
            # hang sources. Lines 1-177 (orchestrator) and 460-635 (parse
            # builders) remain mutation-tested — the end-to-end LinkedIn parse
            # tests kill those.
            # 545/556/597 stay excluded too: they are `while`-loop index
            # counters in the parse builders whose `+=`->`*=`/`-=` mutants make
            # the loop non-terminating (same hang class as the helper layer).
            # The remaining six are loop/guard boundary mutations on valid
            # input that are behaviorally equivalent (or panic only on
            # malformed odd-length input): the `<`->`<=` comparisons on the
            # parse-builder `while` loops (543/551/594:17) and the education
            # `open < close` guard (600:47), the `+`->`*` step (594:13, equal
            # to `i < len`), and the `open < close`->`true` guard (600:42,
            # always-true for well-formed parens). These are excluded
            # surgically by exact mutation name so the caught `==`/`>`/`-`/
            # `false` variants on the same lines stay mutation-tested.
            #
            # auth.rs/drive.rs: no exclusions — the wasm half lives in
            # auth_wasm.rs/drive_wasm.rs (covered by the wasm shard), what
            # remains is native-only code, every function pinned by a
            # dedicated native `#[test]` (see the auth-drive entry this
            # replaced for the per-function breakdown).
            exclude_re: "embeddings.rs:(157|158|159|200|31[89]|33[89])|score.rs:(98|107)|skill_duration.rs:125|renderer.rs:84[2-9]|renderer.rs:85[0-9]|renderer.rs:86[0-2]|linkedin_import.rs:(92|545|556|597|17[89]|1[89][0-9]|2[0-4][0-9]|25[0-9]|2[6-9][0-9]|3[0-9][0-9]|4[0-5][0-9]|543:13: replace < with <=|551:17: replace < with <=|594:17: replace < with <=|594:13: replace \\+ with \\*|600:42: replace match guard open < close with true|600:47: replace < with <=)"
            # linkedin_import.rs's full --lib test-suite scenarios run
            # slowly per mutant, so this merged shard keeps its longer
            # per-mutant timeout (applies to the other files' mutants too
            # now, harmlessly — just a higher ceiling, not a target).
            timeout: 1200
          # pdf-import used to be one shard scanning all six files
          # together — it took 2h54m and failed (CI job list from
          # 2026-09-XX). It was split one shard per file so a slow/large
          # file can't drag the others down and a real problem doesn't
          # hide behind an overall shard timeout. The hang sources behind
          # that 2h54m are gone (the harvest.rs `+=` loop counters and the
          # dates.rs wraparound counters are `.saturating_add()` now), and
          # the per-file shards came back down to 2-35min each — but most
          # are now UNDER the 20min floor, so they're re-merged into three
          # chunks (harvest+mod ~37m, dates+text ~28m, sections+experience
          # ~43m) that stay inside the ceiling while each file's exclusion
          # regex stays per-file. `tests.rs`/`regression_corpus.rs` are
          # `#[cfg(test)]`-only (fixtures + test fns, see mod.rs) and
          # deliberately excluded from every `files:` below, not from
          # `exclude_re` — cargo-mutants wouldn't generate mutants for
          # `#[cfg(test)]` code anyway, but there's no reason to even
          # scan them.
          - name: pdf-import-harvest
            files: src/services/pdf_import/mod.rs src/services/pdf_import/harvest.rs
            # mod.rs: import_pdf (179-189) calls extract_text (the untested
            # binary layer in text_extraction.rs, see pdf-import-dates
            # below) as its very first step, so it inherits the same
            # "needs a real binary PDF fixture" limitation and is excluded
            # for the same reason. `parse_cv` itself (which import_pdf
            # calls next) takes plain extracted text and IS tested
            # directly, including its section-header routing (see
            # parse_cv_routes_projects_section_into_cv_projects /
            # parse_cv_routes_certifications_section_into_cv_certifications
            # in tests.rs) — this exclusion is specifically about
            # import_pdf's own extract_text call, not parse_cv.
            #
            # harvest.rs: the two known-hanging loops ARE fixed (see the
            # split's rationale above, `.saturating_add` on `inst_end` and
            # the token-index `i`), and a real per-mutant triage pass has
            # since been done — see the tests added for
            # build_education_from_buffer/build_education_institution_first
            # (embedded "X in Y"/"X en Y"/"X · Y" degree/field splits, the
            # `None`-arm institution/field slicing, `inst_end`'s starting
            # value), parse_education (year-only-line boundary, the
            # degree-first/institution-first entry-split flush), and
            # push_skill_entry (length boundary, header-line rejection).
            #
            # 164: `.filter(|f| !f.is_empty())` on `embedded_field` in
            # build_education_from_buffer, flipped to keep only empty
            # strings. Equivalent -- `embedded_field`'s filtered result is
            # always the FIRST element pushed into `field_parts` (before
            # any `field_lines` are appended), so whether an empty string
            # is kept or dropped there only ever affects a *leading*
            # position in the joined string, which the final
            # `.trim()` on `field.field.en` strips either way.
            exclude_re: "mod.rs:(179|18[0-9]):|harvest.rs:164"
          - name: pdf-import-dates
            files: src/services/pdf_import/dates.rs src/services/pdf_import/text_extraction.rs
            # dates.rs: find_date_range_span (169-275) and
            # extract_trailing_date_range_from_title (288-329) -- bounds-
            # check arithmetic (`<` vs `<=`, `+` vs `*`) whose flips would
            # panic on out-of-range token reads rather than change output,
            # behavior pinned by the find_date_range_span_*/
            # extract_trailing_date_range_from_title_* boundary tests.
            #
            # 110: `words.len() - 1` -> `/` in extract_date_range_from_end's
            # bare-year fallback branch. Equivalent -- `words.len() / 1 ==
            # words.len()`, so the only observable difference is whether
            # the trailing token is included in `before_start`, and that
            # trailing token is (by this branch's own guard) all ASCII
            # digits, contributing zero alphabetic characters. The only
            # consumer, `real_company_text`, counts alphabetic characters
            # only, so it's provably identical either way, and
            # `before_start` has no other use in this branch.
            #
            # Re-derive these ranges with
            # `awk '/^pub\(super\) fn NAME/{print NR}' dates.rs` (find the
            # opening line) and read forward to the matching closing brace
            # if this exclude starts reporting stale MISSEDs again -- they
            # drift whenever a doc comment above these functions changes.
            #
            # text_extraction.rs: the binary-PDF extraction layer (matrix
            # composition, resource/cmap resolution, raw content-stream
            # extraction, glyph positioning, column/row grouping of
            # positioned lines, operator dispatch, content-stream
            # decompression) is only reachable through real, binary PDF
            # documents -- the test suite drives parsing from extracted-
            # text fixtures instead, so this whole file is excluded EXCEPT
            # `run_operations` (1082-1297), which now has two direct tests
            # (`run_operations_inserts_spaces_and_newlines_for_positioned_
            # runs`, `run_operations_ligature_glyph_does_not_insert_
            # spurious_space`) and so is deliberately carved out of the
            # range below rather than excluded.
            #
            # Struct field-deletion mutants (delete field ... from struct
            # ... literal, in experience.rs/harvest.rs) are NOT filterable
            # by exclude_re at all (cargo-mutants 27 does not apply
            # exclude-name matching to Genre::StructField), so they're
            # instead eliminated by source/tests: redundant default-valued
            # fields are removed from struct literals, and every populated
            # field is pinned by the parse_*/build_* unit tests.
            #
            # decode_content_raw's tail (1543-1548, the BT/ET-block "advance
            # past any unrecognized byte" else-arm and the outer "still
            # scanning for BT" else-arm) is now directly covered by
            # decode_content_raw_* tests below. Only the `+=` -> `*=`
            # variant on each of those two `i += 1;` lines stays excluded:
            # multiplying a loop index by the literal 1 is a true identity
            # (i *= 1 == i, always), so whenever that arm is reached at all
            # the scan can never advance and the surrounding `while i < len`
            # loops forever -- unkillable by any test, same "hang instead of
            # failing" class already excluded above for linkedin_import.rs's
            # while-loop counters. The sibling `+=` -> `-=` variant on each
            # line is NOT excluded: decrementing instead of incrementing
            # counts back down to `i == 0` in a bounded number of steps and
            # then underflows (usize `i -= 1` at 0 panics), so it's a fast,
            # deterministic failure the new tests catch directly.
            exclude_re: "dates.rs:(169|1[7-9][0-9]|27[0-5]|2[0-6][0-9]|28[8-9]|29[0-9]|3[0-2][0-9]|110):|text_extraction.rs:([1-9]|[1-9][0-9]|[1-9][0-9][0-9]|108[0-1]|10[0-7][0-9]|129[8-9]|154[0-2]|15[0-3][0-9]|1[3-4][0-9][0-9]):|text_extraction.rs:1544:23: replace \\+= with \\*=|text_extraction.rs:1548:15: replace \\+= with \\*="
          - name: pdf-import-sections
            files: src/services/pdf_import/sections.rs src/services/pdf_import/experience.rs
            # sections.rs: guess_name (283-343) -- email/phone/URL lines
            # always fail the is_alphabetic name-char check, and every
            # accented char is already alphabetic, so deleting/reshaping
            # those ||/== clauses is observationally identical; guess_title
            # (346-387) -- name-line-boundary arithmetic masked by an
            # unwrap_or(0) fallback, behavior pinned by tests.
            #
            # 95: `email.contains('@') && email.contains('.')` in
            # extract_email, flipped to `||`. Equivalent -- this is a
            # SECOND check on `email`, which is `w` (already gated at line
            # 83 by the identical `w.contains('@') && w.contains('.')`)
            # with disallowed characters filtered out; the filter
            # explicitly keeps both '@' and '.', so it can never remove
            # them. Given line 83 already guaranteed both are present and
            # the filter can't lose them, line 95's check is always true
            # regardless of which operator is used.
            #
            # 108: `c == '+'` in extract_phone's char-cleaning closure,
            # flipped to `!=`. Equivalent -- `cleaned`'s special-casing of
            # '+' turns out to be vestigial for the actual output: the
            # final `digits` string is built by filtering EVERYTHING
            # (`words.join("")`) down to ASCII digits only, which discards
            # '+' either way (it's never a digit), and `has_plus` is
            # computed separately, directly from the original `text`, not
            # from `cleaned` at all. So whether this closure preserves or
            # blanks '+' (or, for that matter, any other non-digit
            # character it now also mishandles under the `!=` mutant)
            # never reaches the function's return value.
            #
            # experience.rs: no exclusions -- given the same per-mutant
            # triage pass dates.rs/sections.rs got, after this shard
            # reported a long MISSED list (word-count/alphabetic-count
            # boundaries in the mid-line date normalizer; the 5-way "at
            # /chez/·/|/," OR-chain guarding layout (d); the role-first
            # unambiguous-marker check and its layout-(b) override; each
            # separator's byte-offset split; both `skip_until = i + 2`
            # sites; the 7-way bullet-marker OR-chain;
            # `find_duplicate_job_boundary`'s loop guard; and
            # `reclaim_stray_experience_content`'s prev/prev2
            # plausibility checks, index arithmetic, and backward
            # bullet-walk). All of these turned out to be genuinely
            # killable (not equivalent/unobservable) and are now pinned by
            # dedicated tests in tests.rs rather than excluded here.
            exclude_re: "sections.rs:(28[3-9]|29[0-9]|34[0-3]|3[0-3][0-9]|34[6-9]|38[0-7]|3[5-7][0-9]|95|108):"
          # wasm shard: the wasm32-only half of auth.rs/drive.rs/
          # worker.rs/skill_duration.rs was restructured into its own
          # `#[cfg(target_arch = "wasm32")]` module file per service
          # (`src/services/{auth,drive,worker,skill_duration}/*_wasm.rs`),
          # so the mutating here covers only files whose every function is
          # either wasm-testable or `#[cfg_attr(test, mutants::skip)]`-
          # attributed. That makes the wasm32 harness SOUND — which it
          # wasn't against the old mixed native+wasm files: wasm-bindgen-
          # test only executes `#[wasm_bindgen_test]`s ("the normal #[test]
          # cannot be used and will not work" under that target/runner), so
          # mutating a file that also held native `#[test]`s meant those
          # silently didn't run and everything they'd normally catch
          # (now_ms, month_from_name, format_years, EmbeddingWorker
          # methods, serde round-trips, ...) reported as a mass false
          # "missed". After the restructure none of the wasm `-f` filters
          # select a file containing a native `#[test]`, so that whole
          # artifact class is gone. (The parents' `#[cfg(test)] mod tests`
          # blocks are still compiled into a wasm32 test build, they just
          # never execute there — which is fine, because mutants are only
          # ever generated in the pure *_wasm.rs files, whose only living
          # tests are the `#[wasm_bindgen_test]`s in their own
          # (skip-attributed) `wasm_tests` modules.)
          #
          # Functions with no wasm test at all — auth.rs's `init`/
          # `start_oauth` (need the real Google GIS script + user OAuth
          # consent) and `get_gis_oauth2` internals, drive.rs's `check`/
          # `drive_backup`/`drive_restore` (need a real Google Drive API
          # call), worker.rs's `fetch_via_cache`/
          # `fetch_model_bytes_cached` (need a live network fetch) — are
          # excluded from mutation entirely via a source-level
          # `#[cfg_attr(test, mutants::skip)]` on each in the *_wasm.rs
          # modules themselves, so they generate no mutants here and need
          # no `exclude_re`.
          #
          # This shard is the expensive one (each mutant triggers a wasm32
          # test-build + real Chromium run via the
          # `wasm-bindgen-test-runner`; the four former wasm-* shards each
          # ran in 8-12min and are merged into this ~40min job), hence the
          # job-level `timeout-minutes: 360` bump.
          - name: wasm
            wasm: true
            files: src/services/auth/auth_wasm.rs src/services/drive/drive_wasm.rs src/services/skill_duration/skill_duration_wasm.rs src/services/worker/worker_wasm.rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.wasm && 'wasm32-unknown-unknown' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Install matching wasm-bindgen-cli
        if: matrix.wasm
        # `wasm-bindgen-test-runner` (from wasm-bindgen-cli) must be the
        # EXACT same version as the `wasm-bindgen` crate this project
        # resolves to, or it refuses to run at all. Reading the version
        # `cargo metadata` actually resolves (rather than hard-coding one,
        # which silently goes stale the moment Cargo.toml's
        # The lockfile is committed in this repo, but reading the version
        # `cargo metadata` actually resolves (rather than hard-coding one,
        # which silently goes stale the moment Cargo.toml's
        # `wasm-bindgen = "0.2"` range resolves to a newer patch) keeps
        # this correct automatically regardless of lockfile drift.
        run: |
          WBG_VERSION=$(cargo metadata --format-version=1 \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' \
            | head -n1)
          echo "Installing wasm-bindgen-cli $WBG_VERSION to match Cargo.lock"
          cargo install wasm-bindgen-cli --version "$WBG_VERSION" --locked
      - name: Setup Chrome
        if: matrix.wasm
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Setup chromedriver
        if: matrix.wasm
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          MAJOR=${CHROME_VERSION%%.*}
          DRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json" \
            | python3 -c "import sys,json; versions=[v for v in json.load(sys.stdin)['versions'] if v['version'].startswith('${MAJOR}.')]; print(versions[-1]['version'])")
          curl -sL "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip" -o /tmp/cd.zip
          unzip -o /tmp/cd.zip -d /tmp/cd
          chmod +x /tmp/cd/chromedriver-linux64/chromedriver
          echo "/tmp/cd/chromedriver-linux64" >> $GITHUB_PATH
          echo "CHROMEDRIVER=/tmp/cd/chromedriver-linux64/chromedriver" >> $GITHUB_ENV
      - name: "Run mutation tests (${{ matrix.name }})"
        id: mutants
        run: |
          set -o pipefail
          i=0
          fatal=0
          EXCLUDE_RE="${{ matrix.exclude_re }}"
          TIMEOUT="${{ matrix.timeout }}"
          TIMEOUT="${TIMEOUT:-600}"
          CARGO_ARGS=()
          if [ "${{ matrix.wasm }}" = "true" ]; then
            CARGO_ARGS=(-C --target=wasm32-unknown-unknown)
          fi
          for f in ${{ matrix.files }}; do
            echo "::group::$f"
            if [ -n "$EXCLUDE_RE" ]; then
              cargo mutants -f "$f" --no-times --in-place -o "work-$i" --timeout "$TIMEOUT" "${CARGO_ARGS[@]}" --exclude-re "$EXCLUDE_RE" && ec=0 || ec=$?
            else
              cargo mutants -f "$f" --no-times --in-place -o "work-$i" --timeout "$TIMEOUT" "${CARGO_ARGS[@]}" && ec=0 || ec=$?
            fi
            echo "::endgroup::"
            if [ "$ec" -ne 0 ]; then
              echo "FATAL: cargo-mutants exited $ec on $f"
              fatal=$ec
            else
              echo "cargo-mutants exited $ec on $f"
            fi
            i=$((i + 1))
          done
          mkdir -p mutants.out
          for d in work-*/mutants.out; do
            [ -f "$d/caught.txt" ] && cat "$d/caught.txt" >> mutants.out/caught.txt
            [ -f "$d/missed.txt" ] && cat "$d/missed.txt" >> mutants.out/missed.txt
            [ -f "$d/unviable.txt" ] && cat "$d/unviable.txt" >> mutants.out/unviable.txt
          done
          echo "Merged $(wc -l < mutants.out/caught.txt 2>/dev/null || echo 0) caught, $(wc -l < mutants.out/missed.txt 2>/dev/null || echo 0) missed, $(wc -l < mutants.out/unviable.txt 2>/dev/null || echo 0) unviable"
          echo "fatal=$fatal" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-${{ matrix.name }}
          path: mutants.out
          retention-days: 30
      - name: "Fail if mutations missed"
        if: steps.mutants.outputs.fatal != '0'
        run: |
          echo "cargo-mutants found missed/timeout mutants — exiting"
          exit ${{ steps.mutants.outputs.fatal }}

  cargo-mutants-summary:
    name: Mutation Tests Summary
    if: always()
    needs: [cargo-mutants]
    runs-on: ubuntu-latest
    outputs:
      total_missed: ${{ steps.report.outputs.total_missed }}
    steps:
      - name: Download all mutant artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-*
          path: mutants/
          merge-multiple: false
      - name: Report results
        id: report
        run: |
          echo "## Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Shard | Caught | Missed | Unviable |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          total_caught=0
          total_missed=0
          total_unviable=0
          for dir in mutants/mutants-*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir" | sed 's/^mutants-//')
            caught=0; missed=0; unviable=0
            [ -f "$dir/caught.txt" ] && caught=$(wc -l < "$dir/caught.txt")
            [ -f "$dir/missed.txt" ] && missed=$(wc -l < "$dir/missed.txt")
            [ -f "$dir/unviable.txt" ] && unviable=$(wc -l < "$dir/unviable.txt")
            total_caught=$((total_caught + caught))
            total_missed=$((total_missed + missed))
            total_unviable=$((total_unviable + unviable))
            if [ "$missed" -gt 0 ]; then
              echo "| $name | $caught | **$missed** | $unviable |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | $caught | $missed | $unviable |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $total_caught caught / $total_missed missed / $total_unviable unviable**" >> $GITHUB_STEP_SUMMARY
          echo "total_missed=$total_missed" >> $GITHUB_OUTPUT