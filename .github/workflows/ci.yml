name: CI/CD cv-generator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read
  pages: write
  id-token: write

env:
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SECURITY SCAN ─────────────────────────────────────
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ── SUPPLY CHAIN SCAN ─────────────────────────────────
  # Advisories (known CVEs / yanked crates), license compliance, and
  # dependency-source checks against deny.toml. Complements the secret
  # scan above: that catches leaked credentials, this catches
  # vulnerable or license-incompatible dependencies before they ship
  # in the WASM/Android builds.
  supply-chain:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # ── RUST CORE ─────────────────────────────────────────
  rust-core:
    name: Rust Core (test + WASM check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --lib
      - name: Check WASM build
        run: cargo check --target wasm32-unknown-unknown

  # ── WEB (WASM) BUILD ──────────────────────────────────
  web-build:
    name: Build WASM
    needs: [rust-core, supply-chain]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v7
      # Pinned on purpose: "@stable" now resolves to 1.99.0, whose LLVM 23
      # codegen makes dx's wasm output fail in wasm-bindgen with
      #   import of `__wbg_abort_...` doesn't have an adapter listed
      # (DioxusLabs/dioxus#5766 — first bad nightly 2026-08-06 is the LLVM 23
      # upgrade). 1.97.1 builds this project successfully and predates it.
      # Move this forward once the upstream wasm-bindgen fix lands.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: apt update && apt install -y build-essential
      - name: Install Dioxus CLI
        run: |
          curl -sSLO https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/dx-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 dx /usr/local/bin/dx
      - name: Build WASM
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: dx build --release --package cv-generator --debug-symbols false --base-path /CVGenerator/app
      - name: Verify WASM build
        run: |
          WASM=$(find target/dx -name "*.wasm" | head -1)
          if [ -z "$WASM" ]; then
            echo "ERROR: No WASM file found after build"
            exit 1
          fi
          echo "WASM: $WASM ($(stat -c%s "$WASM") bytes)"
          sha256sum "$WASM"
      - name: Install npm deps
        env:
          HUSKY: 0
        run: npm ci
      - name: Upload WASM build
        uses: actions/upload-artifact@v7
        with:
          name: wasm-public
          path: target/dx/cv-generator/release/web/public/
          retention-days: 1

  # ── PLAYWRIGHT E2E TESTS (SHARDED) ────────────────────
  playwright-tests:
    name: Playwright Tests (shard ${{ matrix.shard }}/2)
    needs: [web-build]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Download WASM build
        uses: actions/download-artifact@v8
        with:
          name: wasm-public
          path: target/dx/cv-generator/release/web/public/
      - name: Install npm deps
        env:
          HUSKY: 0
        run: npm ci
      - name: Run e2e tests (shard ${{ matrix.shard }}/2)
        env:
          HOME: /root
          DOCKER_CONFIG: /tmp/.docker
        run: npx playwright test --reporter=list,html --shard=${{ matrix.shard }}/2
      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  # ── ANDROID BUILD (Dioxus Mobile) ────────────────────
  build-android:
    name: Build Android APK + AAB
    if: github.ref == 'refs/heads/main'
    needs: [scan-secrets, supply-chain, rust-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Cache Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Setup stable debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          DEST="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          SP="${KEYSTORE_PASSWORD:-android}"
          KP="${KEY_PASSWORD:-android}"
          ALIAS_RAW="${KEY_ALIAS}"
          ALIAS="${ALIAS_RAW:-androiddebugkey}"
          echo "--- Keystore setup: SP=$SP KP=$KP ALIAS=$ALIAS"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding base64 keystore (${#KEYSTORE_BASE64} chars)..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$DEST.tmp"
            SZ=$(stat -c%s "$DEST.tmp" 2>/dev/null || echo 0)
            echo "Decoded file size: $SZ bytes"
            if keytool -list -v -keystore "$DEST.tmp" -storepass "$SP" -keypass "$KP" 2>/dev/null; then
              echo "Keystore is readable with SP/KP — copying directly"
              cp "$DEST.tmp" "$DEST"
            else
              echo "Direct read failed — trying JKS conversion"
              keytool -importkeystore \
                -srckeystore "$DEST.tmp" \
                -destkeystore "$DEST" -deststoretype pkcs12 \
                -srcstorepass "$SP" -deststorepass "$SP" \
                -srcalias "$ALIAS" -destalias "$ALIAS" \
                -srckeypass "$KP" -destkeypass "$KP" 2>&1 || \
              { echo "WARNING: Keystore conversion failed, removing"; rm -f "$DEST"; }
            fi
            rm -f "$DEST.tmp"
          elif [ -f "$DEST" ]; then
            echo "Keystore restored from cache"
          else
            keytool -genkey -v -keystore "$DEST" \
              -alias "$ALIAS" -storepass "$SP" -keypass "$KP" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug keystore"
          fi
          if [ -f "$DEST" ]; then
            echo "--- Keystore verification ---"
            keytool -list -v -keystore "$DEST" -storetype pkcs12 -storepass "$SP" -keypass "$KP" \
              | grep -E "SHA1|Alias name:|Erweiterte|Extended|Eintragsart|Entry type:" || \
              echo "WARNING: Could not verify keystore fingerprint"
          fi
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy `tools` SDK package from the repo
          # index on 2026-09-14 (tracked upstream:
          # https://github.com/android-actions/setup-android/issues/537).
          # The action's default `packages` input is `tools platform-tools`,
          # so leaving it unset now fails every run with
          # "Warning: Failed to find package 'tools'" before any build step
          # runs. Nothing here actually needs the deprecated `tools`
          # package — `dx build --platform android` generates the Gradle
          # project, and Gradle itself resolves the platforms/build-tools
          # versions it needs — so pin to just `platform-tools`.
          packages: "platform-tools"
      - name: Install Dioxus CLI
        run: |
          curl -sSLO https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/dx-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf dx-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 dx /usr/local/bin/dx
      - name: Clean stale artifacts
        run: cargo clean -p cv-generator
      - name: Build Android APK (aarch64) — first pass (generates project)
        run: dx build --release --platform android --package cv-generator --target aarch64-linux-android
      - name: Build Android APK (armv7) — 32-bit devices
        # `dx build` compiles exactly one --target per invocation, so the
        # aarch64 build above only ever produced lib/arm64-v8a. Play then
        # lists the app as "device isn't compatible" on 32-bit-only phones
        # (e.g. Redmi 23129RN51X running a 32-bit Android 16 userspace,
        # abi = armeabi-v7a). Build the 32-bit ABI too so the same Gradle
        # project ends up with both jniLibs/arm64-v8a and jniLibs/armeabi-v7a.
        run: dx build --release --platform android --package cv-generator --target armv7-linux-androideabi
      - name: Remove first-pass APK (no overlays)
        run: find target/dx -name "*.apk" -delete 2>/dev/null || true
      - name: Overlay custom Android resources (icons, OAuth strings)
        # Dioxus.toml's [bundle] icon is meant to cover the icon, but
        # Android specifically has had reports of that config not taking
        # effect (github.com/DioxusLabs/dioxus/issues/3685), and it can't
        # express a real adaptive icon (foreground/background layers)
        # anyway — only a single flat image. So overwrite the generated
        # Gradle project's launcher icon resources directly with our own,
        # using the same standard ic_launcher*/ic_launcher_background
        # names Android's own project templates use. This also carries
        # strings.xml, whose default_web_client_id is what the native
        # Google Sign-In overlay (next step) needs — substitute the real
        # secret into it here.
        run: |
          RES_DIR=$(find target/dx -type d -path "*/app/src/main/res" 2>/dev/null | head -1)
          if [ -z "$RES_DIR" ]; then
            echo "ERROR: generated Android res/ dir not found — can't overlay resources"
            exit 1
          fi
          # Dioxus's default template ships its own ic_launcher*.webp in
          # each mipmap-* folder. Android resource identity ignores file
          # extension — ic_launcher.png and ic_launcher.webp are both
          # R.mipmap.ic_launcher — so leaving the defaults in place causes
          # a "Duplicate resources" build failure once we add our .png
          # versions alongside them. Delete anything under the same
          # resource names we're about to provide, in every density
          # folder, before copying ours in.
          find "$RES_DIR" -type f \( \
            -name "ic_launcher.*" -o \
            -name "ic_launcher_round.*" -o \
            -name "ic_launcher_foreground.*" -o \
            -name "ic_launcher_background.*" \
          \) -print -delete
          cp -rv assets/android-res-overlay/* "$RES_DIR/"
          if [ -f "$RES_DIR/values/strings.xml" ]; then
            sed -i "s|__GOOGLE_CLIENT_ID__|$GOOGLE_CLIENT_ID|g" "$RES_DIR/values/strings.xml"
            echo "Injected GOOGLE_CLIENT_ID into strings.xml"
          fi
      - name: Overlay native Google Sign-In (Kotlin + JNI)
        # Google disallows running its OAuth consent screen inside an
        # embedded WebView (which is how this app renders otherwise), so
        # Android sign-in goes through Kotlin + Google Play Services
        # instead — see android/overlay/ and services/android_auth.rs.
        # Ported from the PeopleModeler project, which has this working in
        # production.
        run: |
          KOTLIN_DIR=$(find target/dx -type d -path "*/app/src/main/kotlin" 2>/dev/null | head -1)
          if [ -z "$KOTLIN_DIR" ]; then
            echo "ERROR: generated Android kotlin source dir not found"
            exit 1
          fi
          OVERLAY="android/overlay"
          echo "Overlaying Kotlin code → $KOTLIN_DIR"
          cp -r "$OVERLAY/app/src/main/java/"* "$KOTLIN_DIR/"
          # Remove any duplicate MainActivity from other source dirs
          # (e.g. a stray src/main/java/) to avoid redeclaration.
          find "$KOTLIN_DIR/.." -name "MainActivity.kt" ! -path "$KOTLIN_DIR/*" -delete
          # Copy the ProGuard keep rule (GoogleDriveHelper is called only
          # via JNI, invisible to R8's bytecode analysis).
          APP_DIR=$(dirname "$KOTLIN_DIR" | xargs dirname | xargs dirname)
          if [ -f "$OVERLAY/app/proguard-rules.pro" ]; then
            cp "$OVERLAY/app/proguard-rules.pro" "$APP_DIR/"
            echo "Copied proguard-rules.pro for GoogleDriveHelper keep rule"
          fi
      - name: Overlay Gradle config (play-services-auth)
        # Dioxus's generated build.gradle.kts doesn't know about the
        # Google Play Services Auth dependency GoogleDriveHelper.kt needs,
        # so replace it (and the root build.gradle.kts/gradle.properties)
        # with our own — see android/overlay/.
        run: |
          GRADLE_DIR=$(find target/dx -name "gradlew" -exec dirname {} \; 2>/dev/null | head -1)
          if [ -z "$GRADLE_DIR" ]; then
            echo "ERROR: gradlew dir not found — can't overlay Gradle config"
            exit 1
          fi
          OVERLAY="android/overlay"
          cp "$OVERLAY/build.gradle.kts" "$GRADLE_DIR/build.gradle.kts"
          cp "$OVERLAY/app/build.gradle.kts" "$GRADLE_DIR/app/build.gradle.kts"
          cp "$OVERLAY/gradle.properties" "$GRADLE_DIR/gradle.properties"
          MANIFEST=$(find "$GRADLE_DIR" -path "*/src/main/AndroidManifest.xml" 2>/dev/null | head -1)
          if [ -n "$MANIFEST" ]; then
            sed -i 's/ android:extractNativeLibs="true"//' "$MANIFEST"
            echo "Stripped android:extractNativeLibs from $MANIFEST"
          fi
      - name: Ensure both ABIs are in jniLibs
        # Safety net: if the second `dx build` replaced rather than added to
        # jniLibs (or vice versa), copy the cargo outputs in ourselves using
        # whatever .so filename dx chose for the ABI that did survive.
        run: |
          GRADLE_DIR=$(find target/dx -name "gradlew" -exec dirname {} \; 2>/dev/null | head -1)
          JNI="$GRADLE_DIR/app/src/main/jniLibs"
          mkdir -p "$JNI/arm64-v8a" "$JNI/armeabi-v7a"
          NAME=$(basename "$(find "$JNI" -name '*.so' | head -1)")
          [ -n "$NAME" ] || NAME="libdioxusmain.so"
          echo "Native lib name: $NAME"
          for pair in "arm64-v8a:aarch64-linux-android" "armeabi-v7a:armv7-linux-androideabi"; do
            ABI="${pair%%:*}"; TRIPLE="${pair##*:}"
            if [ -z "$(find "$JNI/$ABI" -name '*.so' | head -1)" ]; then
              SRC="target/$TRIPLE/release/libcv_generator.so"
              [ -f "$SRC" ] || { echo "ERROR: $SRC missing — cannot provide $ABI"; exit 1; }
              cp -v "$SRC" "$JNI/$ABI/$NAME"
            fi
          done
          find "$JNI" -name '*.so' -print
      - name: Assemble release APK via Gradle
        run: |
          GRADLE_DIR=$(find target/dx -name "gradlew" -exec dirname {} \; 2>/dev/null | head -1)
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR" && chmod +x gradlew && ./gradlew assembleRelease
          else
            echo "WARNING: gradlew not found"
          fi
      - name: Build Android AAB (bundle)
        run: |
          GRADLE_DIR=$(find target/dx/cv-generator/release/android -name "gradlew" -exec dirname {} \; 2>/dev/null | head -1)
          if [ -n "$GRADLE_DIR" ]; then
            echo "Running bundleRelease in: $GRADLE_DIR"
            cd "$GRADLE_DIR"
            VCODE=$((100 + ${{ github.run_number }}))
            BG=$(find . -name "build.gradle*" -path "*/app/*" 2>/dev/null | head -1)
            if [ -n "$BG" ]; then
              echo "Injecting versionCode=$VCODE into $BG"
              sed -i "s/versionCode = [0-9]*/versionCode = $VCODE/" "$BG"
            fi
            chmod +x gradlew && ./gradlew bundleRelease
          else
            echo "WARNING: gradlew not found under target/dx/cv-generator/release/android"
            find target/dx -name "gradlew" 2>/dev/null || true
          fi
      - name: Sign APK (sign unsigned release APK if present)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK=$(find target/dx -name "app-release-unsigned.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No unsigned APK found — debug APK already signed by SDK"
            exit 0
          fi
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: debug.keystore not found"
            exit 1
          fi
          SP="${KEYSTORE_PASSWORD:-android}"
          KP="${KEY_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-androiddebugkey}"
          SIGNED="${APK%.apk}-signed.apk"
          ALIGNED="${APK%.apk}-aligned.apk"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -1)
          "${BUILD_TOOLS}/zipalign" -p 4 "$APK" "$ALIGNED"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass "pass:$SP" \
            --key-pass "pass:$KP" --ks-key-alias "$ALIAS" \
            --out "$SIGNED" "$ALIGNED"
          echo "Signed: $SIGNED"
      - name: Sign AAB (required by Google Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB=$(find target/dx -name "*.aab" 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "No AAB found — skipping"
            exit 0
          fi
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: debug.keystore not found"
            exit 1
          fi
          SP="${KEYSTORE_PASSWORD:-android}"
          KP="${KEY_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-androiddebugkey}"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -1)
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass "pass:$SP" \
            --key-pass "pass:$KP" --ks-key-alias "$ALIAS" \
            --min-sdk-version 21 \
            "$AAB"
          echo "Signed AAB: $AAB"
      - name: Collect APK and AAB
        run: |
          mkdir -p dist
          APK=$(find target/dx -name "*-signed.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find target/dx -name "*.apk" 2>/dev/null | head -1)
          fi
          # Unlike the APK step above, apksigner signs the AAB in place
          # (no --out flag), so it keeps its original name rather than
          # gaining a "-signed" suffix — matching "*-signed.aab" here
          # never found anything, which is why the AAB was missing from
          # release artifacts.
          AAB=$(find target/dx -name "*.aab" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" dist/cv-generator.apk
            echo "APK copied from: $APK"
          fi
          if [ -n "$AAB" ]; then
            cp "$AAB" dist/cv-generator.aab
            echo "AAB copied from: $AAB"
          fi
          if [ -z "$APK" ] && [ -z "$AAB" ]; then
            echo "WARNING: No APK or AAB found. Listing target/dx tree..."
            find target/dx -name "*.apk" -o -name "*.aab" 2>/dev/null || true
          fi
      - name: Verify AAB contains both ABIs
        run: |
          [ -f dist/cv-generator.aab ] || { echo "No AAB — skipping"; exit 0; }
          LIST=$(unzip -l dist/cv-generator.aab)
          for abi in arm64-v8a armeabi-v7a; do
            echo "$LIST" | grep -q "lib/$abi/" || { echo "ERROR: AAB is missing lib/$abi/"; exit 1; }
          done
          echo "AAB contains arm64-v8a and armeabi-v7a native libs"
      - name: Package native debug symbols
        run: |
          mkdir -p dist/symbols/arm64-v8a dist/symbols/armeabi-v7a
          FOUND=0
          for pair in "arm64-v8a:aarch64-linux-android" "armeabi-v7a:armv7-linux-androideabi"; do
            ABI="${pair%%:*}"; TRIPLE="${pair##*:}"
            SO="target/$TRIPLE/release/libcv_generator.so"
            if [ -f "$SO" ]; then cp "$SO" "dist/symbols/$ABI/"; FOUND=1
            else echo "WARNING: $SO not found"; fi
          done
          if [ "$FOUND" = 1 ]; then
            cd dist && zip -r symbols.zip symbols/ && rm -rf symbols/
            echo "Created symbols.zip ($(stat -c%s symbols.zip) bytes)"
          fi
      - name: Upload APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/
          retention-days: 7

  # ── DEPLOY WEB TO GITHUB PAGES ────────────────────────
  deploy-web:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [playwright-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Download WASM build
        uses: actions/download-artifact@v8
        with:
          name: wasm-public
          path: ./wasm-dist/
      - name: Merge WASM build with static pages
        run: |
          mkdir -p public/app
          # The SPA is built with base_path /CVGenerator/app, so it has to sit
          # under public/app/ — otherwise its absolute asset URLs resolve to
          # the artifact root and the wasm never loads.
          cp -r wasm-dist/* public/app/
          rm -rf wasm-dist
          # The landing page takes the artifact root. It has to be named
          # index.html, not landing.html: GitHub Pages serves index.html for a
          # directory, so with any other name the bare domain URL 404s.
          cp landing.html public/index.html
          # The demo page is authored as demo/index.html so that its relative
          # paths already match the published layout — copying the directory
          # gives it the clean /CVGenerator/demo URL with no path rewriting.
          cp -r demo public/demo
          mkdir -p public/css public/js public/assets
          cp css/landing.css public/css/landing.css
          cp css/demo.css public/css/demo.css
          cp js/landing.js public/js/landing.js
          cp js/demo.js public/js/demo.js
          # The demo borrows the app's stylesheet so its widgets are the real
          # ones. The Rust build inlines this file into the wasm, so the wasm
          # build never copies it out — publish it for the demo page by hand.
          cp assets/main.css public/assets/main.css
          cp assets/cv-generator-icon.svg public/assets/cv-generator-icon.svg
      - name: Add SPA fallback and cache-control for GitHub Pages
        run: |
          # Pages serves the root 404.html for any path it cannot resolve,
          # which is what makes a hard reload of a client-side route such as
          # /CVGenerator/app/tailor work. It must therefore sit at the root of
          # the published source and hold the SPA's index — NOT the landing
          # page, or an unknown path would render marketing copy instead of the
          # app's own 404 view. A nested public/app/404.html is never consulted.
          if [ -f public/app/index.html ]; then
            cp public/app/index.html public/404.html
          fi
          cat > public/_headers << 'EOF'
          /*.html
            Cache-Control: no-cache, must-revalidate
          /CVGenerator/app/assets/*.js
            Cache-Control: public, max-age=31536000, immutable
          /CVGenerator/app/assets/*.wasm
            Cache-Control: public, max-age=31536000, immutable
          /CVGenerator/css/*
            Cache-Control: public, max-age=3600
          /CVGenerator/js/*
            Cache-Control: public, max-age=3600
          /CVGenerator/assets/*
            Cache-Control: public, max-age=3600
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # ── RELEASE (Android + Web) ──────────────────────────
  release:
    name: Create Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [playwright-tests, build-android]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: android-apk
          path: dist/
      - name: List downloaded files
        run: ls -la dist/ 2>/dev/null || echo "dist/ empty"
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "cv-generator build #${{ github.run_number }}"
          body: "Build #${{ github.run_number }} — Dioxus Rust app."
          files: |
            dist/*.apk
            dist/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
