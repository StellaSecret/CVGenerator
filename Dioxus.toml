[application]
name = "cv-generator"

[web]
title = "CV Generator"
base_path = "/CVGenerator"
pre_compress = true
wasm_opt = ["z"]

[web.watcher]
reload_html = true

[bundle]
# Used as the Android applicationId/package (and the bundle identifier on
# other platforms). Was previously unset, which is why Android builds fell
# back to Dioxus's placeholder "com.example.CvGenerator".
identifier = "com.stellasecret.cvgenerator"
publisher = "Stella Secret"
# NOTE: Android specifically has had reports of this icon config not being
# picked up (github.com/DioxusLabs/dioxus/issues/3685). The CI workflow
# (.github/workflows/ci.yml, "Overlay custom Android app icon" step)
# doesn't rely on this — it copies assets/android-res-overlay/ straight
# into the generated Gradle project's res/ folder as a guaranteed fallback,
# so the Android icon is correct either way. This entry still matters for
# desktop bundles (macOS/Windows/Linux), which do use it.
icon = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/128x128@2x.png",
]
