plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.stellasecret.cvgenerator'
    compileSdk 34

    // Load signing config from key.properties (injected by CI, absent locally)
    def keystorePropertiesFile = rootProject.file("key.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile     file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.stellasecret.cvgenerator"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Injected by CI via -POAUTH_WEB_CLIENT_ID and -PPREMIUM_EMAILS
        // Falls back to empty string for local debug builds
        buildConfigField "String", "OAUTH_WEB_CLIENT_ID",
            "\"${project.findProperty('OAUTH_WEB_CLIENT_ID') ?: ''}\""
        buildConfigField "String", "GEMINI_ENCRYPTION_KEY",
            "\"${project.findProperty('GEMINI_ENCRYPTION_KEY') ?: ''}\""
        buildConfigField "String", "PREMIUM_EMAILS",
            "\"${project.findProperty('PREMIUM_EMAILS') ?: ''}\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "OAUTH_WEB_CLIENT_ID",
                "\"${project.findProperty('OAUTH_WEB_CLIENT_ID') ?: ''}\""
            buildConfigField "String", "PREMIUM_EMAILS",
                "\"${project.findProperty('PREMIUM_EMAILS') ?: ''}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField "String", "OAUTH_WEB_CLIENT_ID",
                "\"${project.findProperty('OAUTH_WEB_CLIENT_ID') ?: ''}\""
            buildConfigField "String", "PREMIUM_EMAILS",
                "\"${project.findProperty('PREMIUM_EMAILS') ?: ''}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/DEPENDENCIES'
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    // Hilt DI
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'

    // Google Auth / Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-functions-ktx'
    implementation 'com.google.firebase:firebase-config-ktx'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // PDF parsing
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // DataStore (preferences)
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'

    // Coil (image loading)
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Accompanist
    implementation 'com.google.accompanist:accompanist-permissions:0.32.0'

    // Apache POI for docx
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // Credential Manager for modern Google Sign-In
    implementation 'androidx.credentials:credentials:1.2.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'

    // Test
    // Le BOM Compose doit être redéclaré pour androidTest et debug :
    // le BOM déclaré dans 'implementation' ne couvre pas ces scopes,
    // ce qui provoque "Could not find androidx.compose.ui:ui-test-junit4:."
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.00')
    debugImplementation platform('androidx.compose:compose-bom:2024.09.00')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

kapt {
    correctErrorTypes true
}
